name: Publish PR Snapshot

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened

jobs:
  mic-helper:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Import the signing certificate
      id: signing
      env:
        CERTIFICATE: ${{ secrets.MACOS_SIGNING_P12 }}
        CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      run: |
        if [ -z "$CERTIFICATE" ]; then
          echo "::warning::no signing certificate, the helper will be signed ad-hoc and the microphone grant will not survive an update."
          exit 0
        fi

        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        CERTIFICATE_FILE="$RUNNER_TEMP/certificate.p12"
        trap 'rm -f "$CERTIFICATE_FILE"' EXIT

        echo "$CERTIFICATE" | base64 -d > "$CERTIFICATE_FILE"
        security create-keychain -p "" "$KEYCHAIN"
        security set-keychain-settings "$KEYCHAIN"
        security unlock-keychain -p "" "$KEYCHAIN"
        security import "$CERTIFICATE_FILE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

        IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep -o '[0-9A-F]\{40\}' | head -1)
        if [ -z "$IDENTITY" ]; then
          echo "::error::the certificate holds no code signing identity."
          exit 1
        fi
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

    - name: Build the microphone helper
      run: ./gradlew :macos:helper:bundleZip --stacktrace -Psnapshot=true -Ppv.mac.signIdentity="${{ steps.signing.outputs.identity }}"

    - name: Upload the bundle
      uses: actions/upload-artifact@v4
      with:
        name: mic-helper
        path: macos/helper/build/distributions/PVMicHelper.zip
        if-no-files-found: error

  build:
    needs: mic-helper
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-read-only: false

    - name: Download the microphone helper
      uses: actions/download-artifact@v8.0.1
      with:
        name: mic-helper
        path: build/mic-helper

    - name: Build with Gradle
      run: ./gradlew build --stacktrace -Psnapshot=true -Ppv.mac.helperZip="$GITHUB_WORKSPACE/build/mic-helper/PVMicHelper.zip"

    - name: Upload to Registry
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: plasmoapp/actions/.github/actions/upload-to-registry@main
      with:
        registry_url: ${{ secrets.REGISTRY_URL }}
        upload_token: ${{ secrets.REGISTRY_UPLOAD_TOKEN }}
        message: ${{ github.event.head_commit.message }}
