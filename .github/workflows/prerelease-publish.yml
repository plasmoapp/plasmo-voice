name: Publish

on:
  push:
    branches:
      - v2.1.x

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: false

    - name: Build with Gradle
      run: ./gradlew build --stacktrace -Psnapshot=true

    - name: Publish to snapshots maven repository
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: ./gradlew publish --stacktrace -Psnapshot=true

    - name: Publish to GitHub
      uses: apehum/mc-publish@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        github-generate-changelog: false
        github-prerelease: true

    - name: Upload to Registry
      uses: plasmoapp/actions/.github/actions/upload-to-registry@main
      with:
        registry_url: ${{ secrets.REGISTRY_URL }}
        upload_token: ${{ secrets.REGISTRY_UPLOAD_TOKEN }}
        message: ${{ github.event.head_commit.message }}

    - name: Restore previous doc versions
      run: |
        mkdir -p previousDocVersions
        git fetch origin gh-pages --depth=1 || exit 0
        WORK=$(mktemp -d)
        git worktree add "$WORK" origin/gh-pages

        # preserve already-archived older versions
        if [ -d "$WORK/older" ]; then
          cp -r "$WORK/older"/* previousDocVersions/ 2>/dev/null || true
        fi

        # archive the currently deployed version (skip if same as current)
        if [ -f "$WORK/version.json" ]; then
          PREV_VERSION=$(jq -r '.version' "$WORK/version.json")
          CURRENT_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
            mkdir -p "previousDocVersions/$PREV_VERSION"
            rsync -a --exclude='older/' "$WORK/" "previousDocVersions/$PREV_VERSION/"
          fi
        fi

        git worktree remove "$WORK"

    - name: Build dokka
      run: ./gradlew dokkaGeneratePublicationHtml

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/dokka/html
        force_orphan: false
        cname: dokka.plasmovoice.com
