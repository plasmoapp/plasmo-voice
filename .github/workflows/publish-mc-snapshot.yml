name: Publish MC Snapshot

on:
  workflow_dispatch:

concurrency:
  group: mc-snapshot
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mc: ${{ steps.detect.outputs.mc }}
      projects: ${{ steps.detect.outputs.projects }}
      version: ${{ steps.detect.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Detect snapshot client projects
      id: detect
      run: python3 .github/scripts/mc-snapshot.py . ${{ github.sha }}

    - name: Generate changelog
      id: changelog
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        MC: ${{ steps.detect.outputs.mc }}
      run: |
        repo_url="${{ github.server_url }}/${{ github.repository }}"
        source=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number,url --jq '.[0] // empty | "[#\(.number)](\(.url))"')
        if [ -z "$source" ]; then
          source="[$BRANCH]($repo_url/tree/$BRANCH)"
        fi
        changelog="Alpha build for Minecraft $MC from $source@[${SHA:0:7}]($repo_url/commit/$SHA)"
        echo "$changelog"
        echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    name: build (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        project: ${{ fromJson(needs.detect.outputs.projects) }}

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./.github/actions/setup-build

    - name: Restore Essential loom cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/.gradle/caches/essential-loom
          !~/.gradle/caches/essential-loom/minecraftMaven
        key: gradle-loom[${{ matrix.project }}]-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts', 'client/versions.json') }}
        restore-keys: gradle-loom[${{ matrix.project }}]-

    - name: Build ${{ matrix.project }} with Gradle
      run: ./gradlew :client:${{ matrix.project }}:build --stacktrace -Pproject.client.only=${{ matrix.project }} -Pversion=${{ needs.detect.outputs.version }}

    - name: Upload build artifact
      uses: plasmoapp/actions/.github/actions/upload-artifacts@main
      with:
        files_glob: build/libs/*.jar
        archive: false
        retention_days: 7
        if_no_files_found: error
        summary: false

  modrinth:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: '*.jar'
        path: build/libs/
        merge-multiple: true

    - name: Publish Client to Modrinth
      uses: apehum/mc-publish@master
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(neoforge|fabric)-*.jar

        environment: client_and_server

        changelog: ${{ needs.detect.outputs.changelog }}
        version-type: alpha

        game-versions: ${{ needs.detect.outputs.mc }}

        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
