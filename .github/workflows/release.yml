name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
      publish-maven:
        description: 'Publish to Maven repository'
        type: boolean
        default: true
      publish-modrinth:
        description: 'Publish to Modrinth'
        type: boolean
        default: true
      publish-curseforge:
        description: 'Publish to CurseForge'
        type: boolean
        default: true
      publish-github:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: true
      publish-dokka:
        description: 'Deploy Dokka docs to GitHub Pages'
        type: boolean
        default: true

jobs:
  mic-helper:
    runs-on: macos-26
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Import the signing certificate
      id: signing
      env:
        CERTIFICATE: ${{ secrets.MACOS_SIGNING_P12 }}
        CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      run: |
        if [ -z "$CERTIFICATE" ]; then
          echo "::error::no signing certificate."
          exit 1
        fi

        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        CERTIFICATE_FILE="$RUNNER_TEMP/certificate.p12"
        trap 'rm -f "$CERTIFICATE_FILE"' EXIT

        echo "$CERTIFICATE" | base64 -d > "$CERTIFICATE_FILE"
        security create-keychain -p "" "$KEYCHAIN"
        security set-keychain-settings "$KEYCHAIN"
        security unlock-keychain -p "" "$KEYCHAIN"
        security import "$CERTIFICATE_FILE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

        IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep -o '[0-9A-F]\{40\}' | head -1)
        if [ -z "$IDENTITY" ]; then
          echo "::error::the certificate holds no code signing identity."
          exit 1
        fi
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

    - name: Build the microphone helper
      run: ./gradlew :macos:helper:bundleZip --stacktrace -Ppv.mac.signIdentity="${{ steps.signing.outputs.identity }}"

    - name: Upload the bundle
      uses: actions/upload-artifact@v7.0.1
      with:
        name: mic-helper
        path: macos/helper/build/distributions/PVMicHelper.zip
        if-no-files-found: error

  build-maven-publish:
    needs: mic-helper
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-read-only: false

    - name: Download the microphone helper
      uses: actions/download-artifact@v8.0.1
      with:
        name: mic-helper
        path: build/mic-helper

    - name: Build with Gradle
      run: ./gradlew build -Ppv.mac.helperZip="$GITHUB_WORKSPACE/build/mic-helper/PVMicHelper.zip"

    - name: Check if already published
      id: maven-check
      run: |
        VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
        URL="https://repo.plasmoverse.com/releases/su/plo/voice/common/${VERSION}/common-${VERSION}.jar"
        CODE=$(curl -s -o /dev/null -w '%{http_code}' -I \
          --connect-timeout 10 --max-time 30 \
          --retry 3 --retry-delay 2 --retry-all-errors "$URL" || true)
        echo "HTTP $CODE for $URL"
        case "$CODE" in
          200)
            echo "$VERSION is already published, skipping maven publication"
            echo "published=true" >> "$GITHUB_OUTPUT"
            ;;
          404)
            echo "published=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::unexpected HTTP $CODE checking $URL"
            exit 1
            ;;
        esac

    - name: Publish to releases maven repository
      if: ${{ inputs.publish-maven && steps.maven-check.outputs.published != 'true' }}
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: ./gradlew publish -Ppv.mac.helperZip="$GITHUB_WORKSPACE/build/mic-helper/PVMicHelper.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: build-libs
        path: build/libs/
        retention-days: 7

  modrinth:
    needs: build-maven-publish
    if: ${{ inputs.publish-modrinth }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.0
    - name: Download build artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-libs
        path: build/libs/

    - name: Publish Paper to Modrinth
      uses: apehum/mc-publish@master
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(Paper)-*.jar

        changelog-file: server/changelog.md
        version-type: ${{ inputs.release-type }}

        game-versions: |
          1.16.5
          1.17.1
          1.18.2
          1.19.2
          1.19.4
          1.20.1
          1.20.4
          >=1.21

        modrinth-unfeature-mode: 'subset'
        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

    - name: Publish Bungee/Velocity to Modrinth
      uses: apehum/mc-publish@master
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(BungeeCord|Velocity)-*.jar

        changelog-file: proxy/changelog.md
        version-type: ${{ inputs.release-type }}

        game-versions: |
          1.16.5
          1.17.1
          1.18.2
          1.19.2
          1.19.4
          1.20.1
          1.20.4
          >=1.21

        modrinth-unfeature-mode: 'subset'
        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

    - name: Publish Client to Modrinth
      uses: apehum/mc-publish@master
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(forge|neoforge|fabric)-*.jar

        environment: client_and_server

        changelog-file: client/changelog.md
        version-type: ${{ inputs.release-type }}

        modrinth-unfeature-mode: 'subset'
        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

  curseforge:
    needs: build-maven-publish
    if: ${{ inputs.publish-curseforge }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7.0.0
    - name: Download build artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-libs
        path: build/libs/

    - name: Publish Client to CurseForge
      uses: apehum/mc-publish@master
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(forge|neoforge|fabric)-*.jar

        environment: client_and_server

        changelog-file: client/changelog.md
        version-type: ${{ inputs.release-type }}

        curseforge-id: 467028
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

  github:
    needs: build-maven-publish
    if: ${{ inputs.publish-github }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7.0.0
    - name: Download build artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        name: build-libs
        path: build/libs/

    - name: Aggregate changelog
      run: |
        {
          sed -e 's|^### Client$|### Client (Fabric/Forge/NeoForge)|' \
              -e 's|^### Server$|### Server (Paper/Minestom/Fabric/Forge/NeoForge)|' \
              client/changelog.md
          if [ -s proxy/changelog.md ]; then
            echo
            echo "### Proxy (Velocity/BungeeCord)"
            cat proxy/changelog.md
          fi
        } > release-changelog.md
        cat release-changelog.md

    - name: Publish to GitHub
      uses: apehum/mc-publish@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        github-generate-changelog: false
        github-prerelease: ${{ inputs.release-type != 'release' }}
        changelog-file: release-changelog.md

  dokka:
    needs: build-maven-publish
    if: ${{ inputs.publish-dokka }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7.0.0
    - name: Set up JDK
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0
      with:
        cache-read-only: false

    - name: Restore previous doc versions
      run: |
        mkdir -p previousDocVersions
        git fetch origin gh-pages --depth=1 || exit 0
        WORK=$(mktemp -d)
        git worktree add "$WORK" origin/gh-pages

        # preserve already-archived older versions
        if [ -d "$WORK/older" ]; then
          cp -r "$WORK/older"/* previousDocVersions/ 2>/dev/null || true
        fi

        # archive the currently deployed version (skip if same as current)
        if [ -f "$WORK/version.json" ]; then
          PREV_VERSION=$(jq -r '.version' "$WORK/version.json")
          CURRENT_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
            mkdir -p "previousDocVersions/$PREV_VERSION"
            rsync -a --exclude='older/' "$WORK/" "previousDocVersions/$PREV_VERSION/"
          fi
        fi

        git worktree remove "$WORK"

    - name: Build dokka
      run: ./gradlew dokkaGeneratePublicationHtml

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/dokka/html
        force_orphan: false
        cname: dokka.plasmovoice.com
