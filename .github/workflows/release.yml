name: Publish Release

on:
  push:
    branches:
      - release/v2.1.x

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: false

    - name: Build with Gradle
      run: ./gradlew build

    - name: Publish to releases maven repository
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: ./gradlew publish

    - name: Publish Paper to Modrinth
      uses: Apehum/mc-publish@v1.1
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(Paper)-*.jar

        changelog-file: server/changelog.md

        game-versions: |
          1.16.5
          1.17.1
          1.18.2
          1.19.2
          1.19.4
          1.20.1
          1.20.4
          1.21
          1.21.1
          1.21.2
          1.21.3
          1.21.4
          1.21.5
          1.21.6
          1.21.7
          1.21.8
          1.21.9
          1.21.10
          1.21.11

        modrinth-unfeature-mode: 'subset'
        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

    - name: Publish Bungee/Velocity to Modrinth
      uses: Apehum/mc-publish@v1.1
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(BungeeCord|Velocity)-*.jar

        changelog-file: proxy/changelog.md

        game-versions: |
          1.16.5
          1.17.1
          1.18.2
          1.19.2
          1.19.4
          1.20.1
          1.20.4
          1.21
          1.21.1
          1.21.2
          1.21.3
          1.21.4
          1.21.5
          1.21.6
          1.21.7
          1.21.8
          1.21.9
          1.21.10
          1.21.11

        modrinth-unfeature-mode: 'subset'
        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

    - name: Publish Client to Modrinth/CurseForge
      uses: Apehum/mc-publish@v1.1
      with:
        name: 'Plasmo Voice'
        split-releases: true
        files-primary: build/libs/*-@(forge|neoforge|fabric)-*.jar

        changelog-file: client/changelog.md

        modrinth-unfeature-mode: 'subset'
        modrinth-id: 1bZhdhsH
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        curseforge-id: 467028
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        
    - name: Publish to GitHub
      uses: Apehum/mc-publish@v1.1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        github-generate-changelog: false

    - name: Restore previous doc versions
      run: |
        mkdir -p previousDocVersions
        git fetch origin gh-pages --depth=1 || exit 0
        WORK=$(mktemp -d)
        git worktree add "$WORK" origin/gh-pages

        # preserve already-archived older versions
        if [ -d "$WORK/older" ]; then
          cp -r "$WORK/older"/* previousDocVersions/ 2>/dev/null || true
        fi

        # archive the currently deployed version (skip if same as current)
        if [ -f "$WORK/version.json" ]; then
          PREV_VERSION=$(jq -r '.version' "$WORK/version.json")
          CURRENT_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
            mkdir -p "previousDocVersions/$PREV_VERSION"
            rsync -a --exclude='older/' "$WORK/" "previousDocVersions/$PREV_VERSION/"
          fi
        fi

        git worktree remove "$WORK"

    - name: Build dokka
      run: ./gradlew dokkaGeneratePublicationHtml

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/dokka/html
        force_orphan: false
